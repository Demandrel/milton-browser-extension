name: CI

# Extension-only pipeline. No Tauri / Rust / SvelteKit toolchain — the
# parent Milton-saas repo's ci.yml runs those; this repo only ships the
# Chromium MV3 extension.
#
# `paths-ignore` skips CI for docs/planning-only PRs.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '_bmad/**'
      - '_bmad-output/**'
      - '.gitignore'
      - 'COPYING'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '_bmad/**'
      - '_bmad-output/**'
      - '.gitignore'
      - 'COPYING'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      # BE-8-10 AC1 / AC11 — production-bundle hardening guardrail.
      # Re-runs `pnpm build` inside the script for hermeticity (build is fast,
      # ~500ms), then greps dist/ for DEV-only spike hooks + spike-page
      # artifacts. Exits non-zero if any leak detected so a PR that drops a
      # DEV gate or re-adds spike-page to the production input never reaches
      # the Chrome Web Store artifact undetected.
      - name: Verify production bundle (no DEV-only hooks shipping)
        run: bash scripts/verify-production-bundle.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: milton-browser-extension-${{ github.sha }}
          path: dist/
          retention-days: 30
