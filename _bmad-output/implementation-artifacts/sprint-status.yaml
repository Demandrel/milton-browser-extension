development_status:
  # Sprint 1: MV1 (Pierre Q1–Q9 charter, 2026-05-04)
  # Goal: dogfoodable .crx that captures refs from any academic page,
  # supports tags / projects / collections, gracefully handles signed-out state.

  # BE-1: Scaffold + connector client + signed-out detection + sideload package.
  # Vite + CRXJS + TS scaffold; manifest V3; toolbar button → minimal popup →
  # POST URL to translate.milton.so/web → POST CSL-JSON to Milton connector →
  # toast in Milton. GET /health probe on popup open. Signed-out: "Open Milton"
  # via milton:// deep-link. pnpm build produces .crx for sideload.
  BE-1-scaffold-connector-client-sideload: done

  # BE-2: Rich popup UX with metadata preview + tag / project / collection
  # selectors. Consumes 18-1's GET /tags + /projects + /collections; submits
  # extended payload (tagIds + newTagNames + projectIds + collectionIds) for
  # atomic transaction on Milton side. Tag chips via getTagColor(name) hash
  # function — NO color picker (memory rule: tags have no user-supplied color).
  BE-2-rich-popup-selectors: done

  # BE-3 (DEFERRED): Page-detection content script. Scans DOM (DOI in metadata,
  # OG type=article, known journal hosts) and surfaces a badge when academic
  # page detected. Promoted only after BE-2 dogfood validates the always-on
  # flow.
  BE-3-page-detection-content-script: backlog

  # BE-4: Auth migration — remove shared MILTON_KEY from extension build,
  # fetch per-save EdDSA JWT from Milton's local connector POST /auth/issue-token
  # (story 18-15), send Authorization: Bearer to translate.milton.so (story TS-6).
  # Handles new error contract: 401 reasons (expired / device_not_registered),
  # 402 codes (quota_exceeded / tier_required), 503 (key_lookup_unavailable).
  # 4-state popup matrix: signed-in / signed-out / Milton-closed / Milton-not-installed.
  # Hard-blocks production Web Store distribution until shipped.
  BE-4-auth-migration-connector-token: done

  # BE-7: Auto-attach PDF when saving from a PDF page. BE-2 dogfood (2026-05-15)
  # net-export pinned two architectural gaps: (1) connector::handlers::add_reference
  # never called maybe_spawn_auto_fetch (asymmetry vs IPC create_reference's
  # post-15-1a behavior); (2) auto_fetch_pdf_inner is OA-discovery only, can't
  # handle direct PDF URLs (working papers, econstor, repository PDFs). BE-7
  # ships both: closes the asymmetry AND adds a new direct-URL fetch path via
  # a new ConnectorReferencePayload.pdfUrl field. Silent best-effort — no popup
  # UI affordance. First BE-N to cross into milton/src-tauri/. Coordinated with
  # Epic 19 Story 19-5 (parallel session) — 19-5 defers tests on connector/payload.rs,
  # connector/handlers.rs, commands/pdf_fetch.rs until BE-7 lands.
  BE-7-pdf-attach-on-extension-save: review
