  # BE-8-9 (NEW SCOPE 2026-05-18) — Background auto-refresh of bundled
  # translators in the extension.
  # On extension startup (and every ~6h thereafter), fetch
  # translators.milton.so/repo/metadata; for each bundled translator whose
  # SHA-256 differs from the manifest, lazy-fetch the new version via the
  # existing translator-fetcher.ts path and prefer the fetched version at
  # runtime. Same Ed25519 manifest + SHA-256 per-translator verification
  # chain as BE-8-5. Cache strategy: reuse chrome.storage.local entries
  # already maintained by translator-fetcher.ts.
  #
  # Closes the gap where bundled translators stay stale until the next
  # extension release. Charter Decision 6 ("bundled subset pinned at build")
  # remains true at BUILD time (reproducible builds); runtime override
  # via auto-refresh is orthogonal and matches Zotero Connector's proven
  # model. Without this, every publisher HTML change requires an extension
  # release — and Milton's sideload-first distribution (Charter Decision 9)
  # has no auto-update mechanism, so a release means "users manually
  # re-sideload" — effectively means most users stay on broken translators
  # indefinitely.
  #
  # Depends on: BE-8-1 (translator-mirror CDN), BE-8-5 (lazy-fetch path +
  # signing/cache infrastructure). No dependency on BE-8-7/8.
  # Theme: capture parity / staleness mitigation.
  # Risk: low-medium. Touches extension startup path + translator resolution
  # order (bundled-vs-fetched). Regression risk: bundled translator could
  # be replaced by a worse upstream version; mitigation = manifest signing
  # is the trust boundary, plus existing SHA-256 verification.
  BE-8-9-auto-refresh-bundled-translators: ready-for-dev

